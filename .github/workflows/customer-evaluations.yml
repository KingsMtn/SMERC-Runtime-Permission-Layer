name: Runtime Customer Evaluations

on:
  workflow_dispatch:
    inputs:
      evaluation_set:
        description: Which metadata-only runtime evaluation set to run.
        required: true
        default: both
        type: choice
        options:
          - both
          - general
          - smerc-f
          - company-template

permissions:
  contents: read

jobs:
  run-customer-evaluations:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run general customer evaluation
        if: ${{ inputs.evaluation_set == 'both' || inputs.evaluation_set == 'general' }}
        run: |
          python -m reference_engine.customer_evaluation examples/customer_eval_actions.json \
            --json-output smerc-customer-evaluations/general/customer_evaluation_report.json \
            --markdown-output smerc-customer-evaluations/general/Customer_Evaluation_Report.md

      - name: Run financial runtime customer evaluation
        if: ${{ inputs.evaluation_set == 'both' || inputs.evaluation_set == 'smerc-f' }}
        run: |
          python -m reference_engine.customer_evaluation examples/smerc_f_customer_eval_actions.json \
            --json-output smerc-customer-evaluations/smerc-f/customer_evaluation_report.json \
            --markdown-output smerc-customer-evaluations/smerc-f/Customer_Evaluation_Report.md

      - name: Run company metadata template evaluation
        if: ${{ inputs.evaluation_set == 'company-template' }}
        run: |
          python -m reference_engine.customer_evaluation examples/customer_metadata_template.json \
            --json-output smerc-customer-evaluations/company-template/customer_evaluation_report.json \
            --markdown-output smerc-customer-evaluations/company-template/Customer_Evaluation_Report.md

      - name: Summarize generated evaluations
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("smerc-customer-evaluations")
          lines = [
              "# SMERC Runtime Customer Evaluation Summary",
              "",
              "Metadata-only evaluations generated by the repository workflow.",
              "",
          ]
          for report_path in sorted(root.glob("*/customer_evaluation_report.json")):
              report = json.loads(report_path.read_text(encoding="utf-8"))
              summary = report["summary"]
              lines.extend(
                  [
                      f"## {report_path.parent.name}",
                      "",
                      f"- Organization: `{report['organization']}`",
                      f"- Actions evaluated: `{summary['total_actions']}`",
                      f"- Posture counts: `{summary['posture_counts']}`",
                      f"- Route state counts: `{summary['route_state_counts']}`",
                      f"- Ref-gate counts: `{summary['ref_gate_counts']}`",
                      f"- Valid ledgers: `{summary['valid_ledgers']}`",
                      f"- Autonomy state: `{summary['autonomy_state']}`",
                      f"- Pilot fit: `{report['pilot_fit']['fit']}`",
                      "",
                  ]
              )
          summary_path = root / "SUMMARY.md"
          summary_path.write_text("\n".join(lines), encoding="utf-8")
          PY

      - name: Upload customer evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smerc-customer-evaluations
          path: smerc-customer-evaluations
          retention-days: 14
