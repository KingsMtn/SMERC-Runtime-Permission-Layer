name: "📊 Submit Sanitized Shadow Data"
description: "Contribute anonymous agent execution metrics to help calibrate the SMERC benchmark."
title: "[Data Submission]: Sanitized Agent Action Footprints"
labels: ["shadow-mode-data", "community-contribution"]
body:
  - type: markdown
    attributes:
      value: |
        ### Thank you for contributing to the SMERC Runtime Layer!
        Before pasting your data, please ensure you have run the `smerc_evaluator.py` sanitation utility locally to strip all AWS Account IDs, custom ARNs, secret strings, and PII.
  - type: textarea
    id: smerc-json-payload
    attributes:
      label: "Sanitized JSON Output"
      description: "Paste the raw array content generated from your local smerc_anonymous_contribution.json file here."
      placeholder: |
        [
          {
            "smerc_record_id": "SMC-SHADOW-8F3B92",
            "action_type": "iam:CreatePolicyVersion",
            "tool_system_class": "aws.iam",
            "external_side_effects": false,
            "reversibility": "Fully Reversible",
            "rollback_latency_seconds": 2,
            "containment_strength": "High",
            "schema_contract_match": true,
            "current_system_posture": "allow"
          }
        ]
    validations:
      required: true
  - type: checkboxes
    id: privacy-clearance
    attributes:
      label: "Privacy & Sanitation Verification"
      options:
        - label: "I confirm that this dataset is entirely anonymous and contains absolutely no company secrets, active credentials, or private target asset identifiers."
          required: true
